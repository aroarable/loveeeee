<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>İstekler</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#1a0d18" />
  <style>
    :root { --bg-1:#1a0d18; --bg-2:#2d1029; --rose:#ff8fbf; --blush:#ffe9f2; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh;
      background: radial-gradient(120% 90% at 50% 0%, var(--bg-2) 0%, var(--bg-1) 70%) fixed;
      color: var(--blush);
      font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 8px 0 20px; }
    .bar { display:flex; gap:10px; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .bar small { opacity:.65; }
    button {
      font: inherit; font-weight: 600; min-height: 44px; padding: 8px 18px; border-radius: 999px; cursor: pointer;
      color: var(--blush); background: transparent; border: 1.5px solid rgba(255,143,191,.55);
    }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .note { background: rgba(255,143,191,.1); border-radius:14px; padding:12px 14px; margin-bottom:16px; font-size:.9rem; }

    .wish {
      margin: 0 0 16px; padding: 14px 16px; border-radius: 16px;
      background: rgba(255,143,191,.12); border: 1px solid rgba(255,143,191,.35);
    }
    .when { font-size: .8rem; opacity: .6; margin-bottom: 6px; }
    .text { white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
    .empty { opacity:.6; text-align:center; margin-top:40px; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
<main>
  <h1>Yazdığı istekler 💗</h1>
  <div class="note" id="localNote" hidden>Konu adı ayarlı değil. Sadece bu tarayıcıdaki kayıtları görüyorsun (test modu).</div>
  <div class="bar"><small id="stamp"></small><button id="refresh">Yenile</button></div>
  <div id="list"></div>
</main>

<script src="config.js"></script>
<script>
  const CFG = window.LOVE_CONFIG || {};
  const $ = id => document.getElementById(id);

  function esc(t) {
    const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML;
  }
  function fmt(ts) {
    return new Date(ts).toLocaleString('tr-TR', { day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' });
  }

  function render(data) {
    const rows = (Array.isArray(data) ? data : Object.values(data || {}))
      .filter(x => x && x.text)
      .sort((a, b) => (b.t || 0) - (a.t || 0));
    $('stamp').textContent = 'Son yenileme: ' + new Date().toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit' });
    $('list').innerHTML = rows.length
      ? rows.map(w => '<article class="wish"><div class="when">' + esc(fmt(w.t)) + '</div><div class="text">' + esc(w.text) + '</div></article>').join('')
      : '<p class="empty">Henüz bir şey yazmadı.</p>';
  }

  async function load() {
    if (!CFG.ntfyTopic) {
      $('localNote').hidden = false;
      try { render(JSON.parse(localStorage.getItem('love_wishes') || '[]')); } catch (e) { render([]); }
      return;
    }
    try {
      const r = await fetch('https://ntfy.sh/' + encodeURIComponent(CFG.ntfyTopic) + '/json?poll=1&since=all');
      if (!r.ok) throw new Error(r.status);
      const lines = (await r.text()).split('\n').filter(Boolean);
      const rows = [];
      lines.forEach(l => {
        try {
          const m = JSON.parse(l);
          if (m.event === 'message' && m.message) rows.push({ text: m.message, t: m.time * 1000 });
        } catch (e) {}
      });
      render(rows);
    } catch (e) {
      $('list').innerHTML = '<p class="empty">Bağlanamadım. İnternetini kontrol et.</p>';
    }
  }

  $('refresh').addEventListener('click', load);
  setInterval(load, 20000);
  load();
</script>
</body>
</html>
